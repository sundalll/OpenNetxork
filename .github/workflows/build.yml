name: Build iOS App (.ipa) & Deploy Server

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-ipa:
    name: Build Murlika iOS .ipa Package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift & Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Create .app Bundle & Compile Real ARM64 iOS Device Binary
        run: |
          mkdir -p Payload/Murlika.app
          cp iOS/Info.plist Payload/Murlika.app/Info.plist
          cp -r iOS/Logo Payload/Murlika.app/Logo
          
          # Copy App Icon files for iOS Home Screen & App Switcher
          cp iOS/Logo/murlogo.png Payload/Murlika.app/murlogo.png
          cp iOS/Logo/murlogo.png Payload/Murlika.app/AppIcon60x60.png
          cp iOS/Logo/murlogo.png Payload/Murlika.app/AppIcon60x60@2x.png
          cp iOS/Logo/murlogo.png Payload/Murlika.app/AppIcon60x60@3x.png
          cp iOS/Logo/murlogo.png Payload/Murlika.app/Icon-60@2x.png
          cp iOS/Logo/murlogo.png Payload/Murlika.app/Icon-60@3x.png
          cp iOS/Logo/murlogo.png Payload/Murlika.app/Icon-76.png
          cp iOS/Logo/murlogo.png Payload/Murlika.app/Icon-76@2x.png
          cp iOS/Logo/murlogo.png Payload/Murlika.app/Icon-83.5@2x.png
          cp iOS/Logo/murlogo.png Payload/Murlika.app/AppIcon.png

          printf "APPL????" > Payload/Murlika.app/PkgInfo
          
          # Compile Swift source files into real arm64-apple-ios device Mach-O executable
          swiftc -v -target arm64-apple-ios14.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            iOS/Models/*.swift iOS/Services/*.swift iOS/ViewModels/*.swift \
            iOS/Views/Common/*.swift iOS/Views/Feed/*.swift iOS/Views/Profile/*.swift \
            iOS/Views/Music/*.swift iOS/Views/Video/*.swift iOS/Views/Channels/*.swift \
            iOS/Views/Auth/*.swift iOS/Views/MainTabView.swift iOS/App/SocialNetworkApp.swift \
            -parse-as-library -emit-executable \
            -o Payload/Murlika.app/Murlika
          
          chmod +x Payload/Murlika.app/Murlika
          file Payload/Murlika.app/Murlika

      - name: Package .ipa File
        run: |
          zip -r Murlika.ipa Payload/
          cp Murlika.ipa LemSocial.ipa
          cp Murlika.ipa OpenNetwork.ipa
          ls -lh Murlika.ipa

      - name: Upload .ipa Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Murlika-iOS-IPA
          path: Murlika.ipa

      - name: Deploy Compiled .ipa Directly to Server (46.53.128.120)
        run: |
          brew install sshpass
          sshpass -p '6G-&R6Pdr0@Ca&(' scp -o StrictHostKeyChecking=no Murlika.ipa root@46.53.128.120:/var/www/contrastfm/Murlika.ipa
          sshpass -p '6G-&R6Pdr0@Ca&(' scp -o StrictHostKeyChecking=no LemSocial.ipa root@46.53.128.120:/var/www/contrastfm/LemSocial.ipa
          sshpass -p '6G-&R6Pdr0@Ca&(' scp -o StrictHostKeyChecking=no OpenNetwork.ipa root@46.53.128.120:/var/www/contrastfm/OpenNetwork.ipa
          echo "Successfully uploaded compiled Murlika.ipa to http://46.53.128.120/Murlika.ipa !"
